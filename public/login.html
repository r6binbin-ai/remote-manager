<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>黑鹰安卓远程 · 登录</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0f15;color:#d8e0ed;font-family:Arial,"Microsoft YaHei"}.panel{width:360px;background:#151b23;border:1px solid #303a46;padding:34px;border-radius:12px;box-shadow:0 14px 60px #0006}h1{font-size:21px;margin:0 0 10px;color:#ff684d}p{font-size:12px;color:#8998aa;margin-bottom:24px}label{display:block;font-size:12px;margin:12px 0 5px}input{width:100%;height:40px;background:#0b121a;border:1px solid #3b4553;border-radius:6px;color:#e6edf8;padding:0 10px}button{height:41px;width:100%;margin-top:22px;background:#2667df;color:#fff;border:0;border-radius:6px;cursor:pointer}#msg{color:#ef7a82;font-size:12px;margin-top:10px;min-height:16px}</style></head><body><form class="panel" id="form"><h1>🦅 黑鹰安卓远程</h1><p>企业设备管理后台 · 管理员登录</p><label>账号</label><input id="user" autocomplete="username" required><label>密码</label><input id="pass" type="password" autocomplete="current-password" required><button type="submit">登录</button><div id="msg"></div></form><script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;document.getElementById('msg').textContent='正在验证…';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('user').value,password:document.getElementById('pass').value})});const d=await r.json();if(r.ok)location.assign('/');else document.getElementById('msg').textContent=d.error||'登录失败';}catch(e){document.getElementById('msg').textContent='网络错误，请重试';}finally{b.disabled=false;}}</script></body></html>
