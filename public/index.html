<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Remote Manager</title>
<style>
body{margin:0;background:#070b12;color:#eee;font-family:Arial}
.login{width:360px;margin:100px auto;background:#111925;padding:30px;border-radius:12px}
input,button{width:100%;padding:12px;margin:8px 0}
button{background:#2563eb;color:white;border:0}
</style>
</head>
<body>
<div class="login">
<h2>Remote Manager</h2>
<input id="u" placeholder="账号">
<input id="p" placeholder="密码" type="password">
<button onclick="login()">登录</button>
</div>
<script>
async function login(){
 let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});
 let d=await r.json();
 if(d.ok) location.href='/dashboard.html'; else alert('账号或密码错误');
}
</script>
</body>
</html>
